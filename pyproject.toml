[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speechwire-live"
version = "0.1.0"
description = "Live dashboard for Speechwire tournament managers"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "html5lib",
    "pandas",
    "numpy",
    "xlsxwriter",
    "nicegui>=2.0",
]

[project.scripts]
speechwire-live = "speechwire_live.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
